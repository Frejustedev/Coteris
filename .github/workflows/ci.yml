name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Qualité : lint, typage, tests unitaires.
  # Rapide, sans service externe. Échoue tôt.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, typage et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Vérification TypeScript
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Intégration : migrations et tests nécessitant PostgreSQL.
  # La version majeure doit rester alignée avec docker-compose.yml et la production.
  # ---------------------------------------------------------------------------
  integration:
    name: Migrations et tests d'intégration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coteris
          POSTGRES_PASSWORD: coteris
          POSTGRES_DB: coteris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coteris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coteris:coteris@localhost:5432/coteris_test
      NODE_ENV: test
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-secret-de-test-uniquement-32-caracteres-minimum
      AUDIT_HASH_SECRET: ci-audit-secret-distinct-32-caracteres-minimum
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./.data/storage
      MAIL_DRIVER: console
      MAIL_FROM: Coteris CI <no-reply@coteris.test>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations
        run: pnpm db:migrate

      # Une migration doit pouvoir être appliquée deux fois sans effet de bord,
      # et le schéma généré doit correspondre exactement aux migrations commitées.
      - name: Vérifier que les migrations sont idempotentes et à jour
        run: |
          pnpm db:migrate
          pnpm db:generate
          if ! git diff --exit-code --quiet packages/database/drizzle; then
            echo "::error::Le schéma Drizzle et les migrations commitées divergent."
            echo "Exécutez 'pnpm db:generate' et commitez la migration produite."
            git diff packages/database/drizzle
            exit 1
          fi

      - name: Tests d'intégration
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  # Build de production. C'est aussi lui qui produit l'artefact déployé :
  # le build ne doit JAMAIS avoir lieu sur l'hébergement mutualisé cible,
  # dont la mémoire est insuffisante (voir docs/adr/0005-deploiement-portable.md).
  # ---------------------------------------------------------------------------
  build:
    name: Build de production
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Sécurité : dépendances vulnérables et secrets committés.
  # ---------------------------------------------------------------------------
  security:
    name: Dépendances et secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Audit des dépendances
        run: pnpm audit --audit-level=high

      - name: Recherche de secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Un fichier .env commité est une fuite, pas un oubli à corriger plus tard.
      - name: Vérifier qu'aucun fichier d'environnement n'est commité
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::Un fichier .env est présent dans le dépôt."
            exit 1
          fi
