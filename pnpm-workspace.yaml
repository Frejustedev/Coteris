packages:
  - 'apps/*'
  - 'packages/*'

# Ces paquets téléchargent un binaire natif via un script d'installation.
# esbuild : requis par Vitest et Next.js.
# sharp   : traitement d'images, requis par l'optimiseur d'images de Next.js.
# Aucun autre paquet n'est autorisé à exécuter de script d'installation.
allowBuilds:
  esbuild: true
  sharp: true
